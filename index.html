<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pari photography</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #111111;
            --text: #ffffff;
            --accent: #ffffff;
            --muted: #555555;
        }
        
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            scroll-behavior: smooth;
        }
        
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: var(--surface);
            padding: 1rem;
            text-align: center;
        }
        
        header nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        header nav a {
            color: var(--text);
            text-decoration: none;
            margin: 0 1rem;
        }
        
        header nav a:hover {
            color: var(--accent);
        }
        
        .hero {
            height: 100vh;
            width: 100%;
            background-image: url(https://res.cloudinary.com/dblzw1rpg/image/upload/v1779989860/velora/7d08fd14-9454-4dbb-94fe-fafb8fdd5a3d/15UmoQvi3SasPObAPLzXe-7GhmlY4P9bz.jpg);
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .hero h1 {
            font-size: 3rem;
            color: var(--text);
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            padding: 2rem;
        }
        
        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(1) contrast(1.4);
            cursor: pointer;
        }
        
        .gallery img:hover {
            opacity: 0.8;
        }
        
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
        }
        
        .lightbox img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }
        
        .about {
            padding: 2rem;
        }
        
        .about p {
            font-size: 1.2rem;
            color: var(--muted);
        }
        
        .contact {
            padding: 2rem;
        }
        
        .contact p {
            font-size: 1.2rem;
            color: var(--muted);
        }
        
        footer {
            background-color: var(--surface);
            padding: 1rem;
            text-align: center;
            color: var(--text);
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: transparent;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="#home">Home</a>
            <a href="#gallery">Gallery</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>

    </div>
    <div class="lightbox" id="lightbox">

    <div class="about" id="about">
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed sit amet nulla auctor, vestibulum magna sed, convallis ex.</p>
    </div>
    <div class="contact" id="contact">
        <p>Email: pari@example.com</p>
    </div>
    <footer>
        <p>Powered by Velora</p>
    </footer>
    <script>
        const images = document.querySelectorAll('.gallery img');
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightbox-image');
        
        images.forEach(image => {
            image.addEventListener('click', () => {
                lightboxImage.src = image.src;
                lightbox.style.display = 'flex';
            });
        });
        
        lightbox.addEventListener('click', () => {
            lightbox.style.display = 'none';
        });
    </script>
</body>
